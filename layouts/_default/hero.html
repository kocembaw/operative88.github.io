<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} · {{ .Site.Title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600&family=VT323&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ece8dd; -webkit-font-smoothing: antialiased;
    }
    .page {
      min-height: 100vh;
      background: #12110e;
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 1rem 1.5rem; padding: 1.6rem 2.2rem;
      border-bottom: 1px solid #2f2d29;
    }
    .brand { font-family: 'Archivo', sans-serif; font-size: 0.95rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #ece8dd; text-decoration: none; }
    .nav { display: flex; align-items: center; flex-wrap: wrap; gap: 1.4rem; }
    .nav a.link { color: #ece8dd; text-decoration: none; font-family: 'VT323', monospace; font-size: 1.35rem; opacity: 0.92; transition: opacity 0.2s ease; }
    .nav a.link:hover { opacity: 1; text-decoration: underline; text-underline-offset: 4px; }
    .socials { display: flex; align-items: center; gap: 1rem; margin-left: 0.4rem; }
    .socials a { color: #ece8dd; opacity: 0.9; display: inline-flex; transition: opacity 0.2s ease, transform 0.2s ease; }
    .socials a:hover { opacity: 1; transform: translateY(-2px); }
    .socials svg { width: 26px; height: 26px; fill: currentColor; display: block; }
    .content-wrap { padding: 1.5rem 1.5rem 5rem; display: flex; justify-content: center; }
    .card {
      width: 100%; max-width: 640px;
      background: #12110e;
      border: 1px solid #2f2d29;
      border-radius: 16px;
      padding: 2.6rem 3rem 3rem;
    }
    .page-title {
      font-size: clamp(1.5rem, 3vw, 2.2rem); font-weight: 300; line-height: 1.1;
      text-decoration: underline; text-underline-offset: 10px; text-decoration-thickness: 1px;
      margin-bottom: 1.8rem;
    }
    .prose { font-size: 1.08rem; line-height: 1.5; }
    .prose p { margin: 0 0 1.2rem; }
    .prose a { color: #ffce54; text-decoration: none; }
    .prose a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .prose ul { list-style: none; padding: 0; margin: 0 0 1.2rem; }
    .prose li { position: relative; padding-left: 1.4rem; margin: 0 0 0.9rem; }
    .prose li::before { content: "•"; position: absolute; left: 0; color: #ece8dd; }
    .prose hr { border: none; border-top: 1px solid #2f2d29; margin: 1.6rem 0; }
    .prose h2, .prose h3 { font-weight: 400; margin: 1.6rem 0 0.8rem; }
    .prose img { display: block; max-width: 100%; height: auto; margin: 0 auto 1.2rem; border-radius: 8px; }
    .contact-socials { display: flex; gap: 1.4rem; margin-top: 0.6rem; }
    .contact-socials a { color: #ece8dd; opacity: 0.92; display: inline-flex; transition: opacity 0.2s ease, transform 0.2s ease; }
    .contact-socials a:hover { opacity: 1; transform: translateY(-2px); }
    .contact-socials svg { width: 34px; height: 34px; fill: currentColor; display: block; }
    @media (max-width: 640px) {
      .topbar { justify-content: center; text-align: center; padding: 1.2rem; }
      .nav { justify-content: center; gap: 1rem; }
      .card { padding: 1.8rem 1.4rem 2.2rem; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .card { animation: fade-up 0.7s ease both; }
      @keyframes fade-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="/">Wojciech Kocemba</a>
      <nav class="nav">
        <a class="link" href="/about/">About</a>
        <a class="link" href="/projects/">Projects</a>
        <a class="link" href="/contact/">Contact</a>
        <span class="socials">
          <a href="https://www.linkedin.com/in/wkocemba21" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
          </a>
          <a href="https://github.com/kocembaw" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
            <svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          </a>
        </span>
      </nav>
    </header>
    <main class="content-wrap">
      <article class="card">
        <h1 class="page-title">{{ .Title }}</h1>
        <div class="prose">
          {{ .Content }}
        </div>
      </article>
    </main>
  </div>
</body>
</html>
