<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} · {{ .Site.Title }}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff; -webkit-font-smoothing: antialiased;
    }
    .page {
      min-height: 100vh;
      background: linear-gradient(rgba(6,20,45,0.20), rgba(6,20,45,0.35)), url('/images/hero.jpg');
      background-size: cover; background-position: center; background-attachment: fixed;
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 1rem 1.5rem; padding: 1.6rem 2.2rem;
    }
    .brand { font-size: 0.95rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #fff; text-decoration: none; }
    .nav { display: flex; align-items: center; flex-wrap: wrap; gap: 1.4rem; }
    .nav a.link { color: #fff; text-decoration: none; font-size: 1.05rem; opacity: 0.92; transition: opacity 0.2s ease; }
    .nav a.link:hover { opacity: 1; text-decoration: underline; text-underline-offset: 4px; }
    .socials { display: flex; align-items: center; gap: 1rem; margin-left: 0.4rem; }
    .socials a { color: #fff; opacity: 0.9; display: inline-flex; transition: opacity 0.2s ease, transform 0.2s ease; }
    .socials a:hover { opacity: 1; transform: translateY(-2px); }
    .socials svg { width: 26px; height: 26px; fill: currentColor; display: block; }
    .content-wrap { padding: 1.5rem 1.5rem 5rem; display: flex; justify-content: center; }
    .card {
      width: 100%; max-width: 640px;
      background: rgba(8,28,58,0.55);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 2.6rem 3rem 3rem;
      backdrop-filter: blur(2px);
    }
    .page-title {
      font-size: clamp(1.5rem, 3vw, 2.2rem); font-weight: 300; line-height: 1.1;
      text-decoration: underline; text-underline-offset: 10px; text-decoration-thickness: 1px;
      margin-bottom: 1.8rem;
    }
    .prose { font-size: 1.08rem; line-height: 1.5; }
    .prose p { margin: 0 0 1.2rem; }
    .prose a { color: #ffce54; text-decoration: none; }
    .prose a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .prose ul { list-style: none; padding: 0; margin: 0 0 1.2rem; }
    .prose li { position: relative; padding-left: 1.4rem; margin: 0 0 0.9rem; }
    .prose li::before { content: "•"; position: absolute; left: 0; color: #eaf1fb; }
    .prose hr { border: none; border-top: 1px solid #ffffff; margin: 1.6rem 0; }
    .prose h2, .prose h3 { font-weight: 400; margin: 1.6rem 0 0.8rem; }
    .contact-socials { display: flex; gap: 1.4rem; margin-top: 0.6rem; }
    .contact-socials a { color: #fff; opacity: 0.92; display: inline-flex; transition: opacity 0.2s ease, transform 0.2s ease; }
    .contact-socials a:hover { opacity: 1; transform: translateY(-2px); }
    .contact-socials svg { width: 34px; height: 34px; fill: currentColor; display: block; }
    @media (max-width: 640px) {
      .topbar { justify-content: center; text-align: center; padding: 1.2rem; }
      .nav { justify-content: center; gap: 1rem; }
      .card { padding: 1.8rem 1.4rem 2.2rem; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .card { animation: fade-up 0.7s ease both; }
      @keyframes fade-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    }
  </style>
</head>
<body>

      <nav class="nav">

        <a class="link" href="/cv/">CV</a>
