<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* plain, single-column style modelled on gws.fyi */
  :root {
    --bg: #f8f3ff;
    --text: #3a1616;
    --link: #1a8fd8;
    --link-visited: #43458b;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 1100px;
    padding: 2rem 2rem 4rem 10rem;
  }
  p { margin: 0 0 1rem; }
  h1, h2, h3 {
    font-weight: 500; line-height: 1.5;
    margin: 1.4rem 0 0;
  }
  h1 { font-size: 1.35rem; margin-top: 0.4rem; }
  h2 { font-size: 1.2rem; }
  h3 { font-size: 1.05rem; }
  a { color: var(--link); text-decoration: underline; text-underline-offset: 2px; }
  a:visited { color: var(--link-visited); }
  a:hover { text-decoration-thickness: 2px; }
  ul { margin: 0 0 1.1rem; padding-left: 2.5rem; }
  li { margin: 0; }
  strong { font-weight: 600; }
  img { max-width: 100%; height: auto; display: block; margin: 0.6rem 0 1.2rem; }
  .back { display: inline-block; margin-bottom: 0.6rem; }
  @media (max-width: 720px) {
    main { padding: 1.5rem 1.25rem 3rem; }
    ul { padding-left: 1.5rem; }
  }
</style>
