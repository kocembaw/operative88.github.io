  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ece8dd; -webkit-font-smoothing: antialiased;
    }
    .hero {
      position: relative; min-height: 100vh;
      display: flex; flex-direction: column;
      background: #12110e;
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 1rem 1.5rem; padding: 1.6rem 2.2rem;
      border-bottom: 1px solid #2f2d29;
    }
    .brand { font-size: 0.95rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; }
    .nav { display: flex; align-items: center; flex-wrap: wrap; gap: 1.4rem; }
    .nav a.link {
      color: #ece8dd; text-decoration: none; font-size: 1.05rem;
      opacity: 0.92; transition: opacity 0.2s ease;
    }
    .nav a.link:hover { opacity: 1; text-decoration: underline; text-underline-offset: 4px; }
    .socials { display: flex; align-items: center; gap: 1rem; margin-left: 0.4rem; }
    .socials a {
      color: #ece8dd; opacity: 0.9; display: inline-flex;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .socials a:hover { opacity: 1; transform: translateY(-2px); }
    .socials svg { width: 30px; height: 30px; fill: currentColor; display: block; }
    .hero-center {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 2rem 1.5rem 10rem;
    }
    .hero-center h1 {
      font-size: clamp(1.8rem, 5vw, 3.4rem); font-weight: 500;
      letter-spacing: -0.01em; line-height: 1.05;
    }
    .tagline { margin-top: 1rem; font-size: clamp(1.05rem, 3vw, 1.7rem); font-weight: 300; opacity: 0.95; }
    @media (max-width: 640px) {
      .topbar { justify-content: center; text-align: center; padding: 1.2rem; }
      .nav { justify-content: center; gap: 1rem; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .hero-center { animation: fade-up 0.9s ease both; }
      @keyframes fade-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    }
  </style>
